<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canhotos — Saldanha Rodrigues</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap">
<style>
    :root {
        --bg-body: #05070A;
        --bg-card: #12161F;
        --bg-header: #0A0E14;
        --bg-input: #0B0D13;
        --text-main: #EEF1F6;
        --text-muted: #8A93A6;
        --accent-blue: #3FC8FF;
        --accent-blue-deep: #1B6FE0;
        --accent-purple: #8B5CF6;
        --accent-green: #35D488;
        --accent-red: #FF6A3D;
        --gold: #F0B94D;
        --border-color: #2E3646;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at top right, #0D1119, #05070A);
        color: var(--text-main);
        margin: 0;
        min-height: 100vh;
    }

    h1, h2, h3 { margin: 0; }

    /* HEADER */
    header {
        background-color: var(--bg-header);
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 100;
        flex-wrap: wrap;
        gap: 14px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
        width: 40px; height: 40px; border-radius: 10px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-deep));
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 18px rgba(63,200,255,0.35);
        flex-shrink: 0;
    }
    .brand-icon i { color: #05070A; font-size: 18px; }
    .brand-text h1 { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; color: var(--text-main); }
    .brand-text p { margin: 0; font-size: 0.75rem; color: var(--text-muted); }

    .user-box { display: flex; align-items: center; gap: 12px; }
    .user-pill {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 14px 6px 6px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border-color);
        border-radius: 30px;
    }
    .user-avatar {
        width: 28px; height: 28px; border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-purple), #6D28D9);
        display: flex; align-items: center; justify-content: center;
        font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; color: white;
    }
    .icon-btn {
        background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);
        width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }

    /* TOOLBAR */
    .toolbar {
        padding: 20px 28px 0;
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .search-box {
        flex-grow: 1; min-width: 220px; height: 44px;
        background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px;
        display: flex; align-items: center; padding: 0 14px; gap: 10px;
    }
    .search-box input {
        background: none; border: none; outline: none; color: var(--text-main);
        font-family: 'Rajdhani', sans-serif; font-size: 15px; width: 100%;
    }
    .search-box i { color: var(--text-muted); }

    .view-toggle {
        padding: 20px 28px 0; display: flex; gap: 8px;
    }
    .view-tab {
        padding: 10px 18px; border-radius: 8px 8px 0 0; border: 1px solid var(--border-color); border-bottom: none;
        background: var(--bg-input); color: var(--text-muted); font-family: 'Rajdhani', sans-serif;
        font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
        transition: all 0.2s;
    }
    .view-tab.active { background: var(--bg-card); color: var(--accent-blue); border-color: var(--accent-blue); }

    .folder-card {
        background: linear-gradient(165deg, #171D28, #0D1119);
        border: 1px solid var(--border-color); border-radius: 12px;
        padding: 22px 20px; cursor: pointer; transition: all 0.15s;
        display: flex; align-items: center; gap: 16px;
    }
    .folder-card:hover { transform: translateY(-3px); border-color: var(--accent-blue); }
    .folder-card i { font-size: 32px; color: var(--accent-blue); flex-shrink: 0; }
    .folder-card .folder-name { font-weight: 700; font-size: 15.5px; color: var(--text-main); }
    .folder-card .folder-count { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

    select.filter-select {
        height: 44px; padding: 0 14px; background: var(--bg-input);
        border: 1px solid var(--border-color); border-radius: 8px;
        color: var(--text-main); font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 14px;
        cursor: pointer;
    }

    .btn {
        padding: 11px 20px; border-radius: 8px; border: none; cursor: pointer;
        font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px;
        display: flex; align-items: center; gap: 8px; white-space: nowrap;
        transition: all 0.2s;
    }
    .btn-primary {
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-deep));
        color: #05070A; box-shadow: 0 0 18px rgba(63,200,255,0.4);
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-ghost {
        background: transparent; border: 1px solid var(--border-color); color: var(--text-main);
    }
    .btn-ghost:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .btn-danger-outline {
        background: rgba(255,106,61,0.08); border: 1px solid var(--accent-red); color: var(--accent-red);
    }

    /* GRID */
    .grid {
        padding: 20px 28px 60px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
    }

    .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
    }
    .empty-state i { font-size: 40px; opacity: 0.4; margin-bottom: 14px; display: block; }

    .card {
        background: linear-gradient(165deg, #171D28, #0D1119);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.15s, border-color 0.15s;
        display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--accent-blue); }
    .card-thumb {
        height: 160px; background-color: var(--bg-input);
        position: relative; overflow: hidden;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-thumb .no-photo { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 22px; }
    .status-badge {
        position: absolute; top: 10px; right: 10px;
        padding: 4px 10px; border-radius: 20px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
        background: rgba(8, 10, 16, 0.85);
        backdrop-filter: blur(4px);
    }
    .status-badge.pendente { border: 1px solid var(--gold); color: var(--gold); }
    .status-badge.baixado { border: 1px solid var(--accent-green); color: var(--accent-green); }

    .type-badge {
        position: absolute; top: 10px; left: 10px;
        padding: 4px 10px; border-radius: 20px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
        background: rgba(8, 10, 16, 0.85);
        border: 1px solid var(--accent-blue); color: var(--accent-blue);
        backdrop-filter: blur(4px);
    }

    .pdf-tile {
        width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 6px; color: var(--text-muted); background: var(--bg-input);
    }
    .pdf-tile i { font-size: 30px; color: var(--accent-red); }
    .pdf-tile span { font-size: 11px; text-align: center; padding: 0 8px; word-break: break-all; }

    .card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .card-cliente { font-weight: 700; font-size: 15px; color: var(--text-main); }
    .card-motorista { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .card-meta { font-size: 12.5px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }

    /* OVERLAYS / MODALS */
    .overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
        z-index: 10000; display: flex; align-items: center; justify-content: center;
        transition: all 0.3s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; display: none !important; }

    .modal {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        z-index: 10001;
        background-color: #0F0F11; border: 1px solid #222; border-radius: 20px;
        width: 92%; max-width: 480px; max-height: 88vh; overflow-y: auto;
        padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(63,200,255,0.08);
        display: flex; flex-direction: column; gap: 20px;
    }
    .modal.hidden { display: none !important; }
    .modal.modal-wide { max-width: 640px; }

    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--text-main); }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .form-group input, .form-group textarea {
        background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main);
        padding: 12px 14px; border-radius: 10px; font-size: 15px; font-family: 'Rajdhani', sans-serif;
        outline: none; transition: all 0.2s; width: 100%;
    }
    .form-group input:focus, .form-group textarea:focus {
        border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(63,200,255,0.15);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .photo-drop {
        border: 1.5px dashed var(--border-color); border-radius: 12px; padding: 24px;
        text-align: center; cursor: pointer; transition: all 0.2s; color: var(--text-muted);
    }
    .photo-drop:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .photo-drop i { font-size: 26px; margin-bottom: 8px; display: block; }

    .photo-preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photo-preview {
        position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
        background-size: cover; background-position: center; border: 1px solid var(--border-color);
    }
    .photo-preview .remove-photo {
        position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
        background: rgba(0,0,0,0.7); color: white; border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center; font-size: 11px;
    }

    /* AUTH */
    .auth-card {
        background-color: var(--bg-card); padding: 40px; border-radius: 24px;
        width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border: 1px solid var(--border-color); text-align: center;
    }
    .auth-icon { margin-bottom: 14px; }
    .auth-card h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.3rem; letter-spacing: 1px; margin-bottom: 4px; }
    .auth-card p.subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .auth-error {
        background: rgba(255,106,61,0.1); color: var(--accent-red); padding: 10px; border-radius: 8px;
        font-size: 13px; margin-bottom: 16px; display: none;
    }
    .btn-login {
        width: 100%; padding: 13px; margin-top: 6px;
        background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-deep));
        border: none; border-radius: 10px; color: #05070A; font-weight: 700; font-size: 15px; cursor: pointer;
    }

    /* TOASTS */
    #toastContainer {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 20000; display: flex; flex-direction: column; gap: 10px; align-items: center;
        pointer-events: none; width: 90%; max-width: 420px;
    }
    .toast {
        display: flex; align-items: center; gap: 12px;
        background-color: var(--bg-card); border: 1px solid var(--border-color);
        border-left: 4px solid var(--accent-blue); border-radius: 12px; padding: 14px 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: var(--text-main);
        font-weight: 600; font-size: 14px; pointer-events: auto;
        animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .toast.hide { animation: toastOut 0.25s ease forwards; }
    .toast.success { border-left-color: var(--accent-green); } .toast.success i { color: var(--accent-green); }
    .toast.error { border-left-color: var(--accent-red); } .toast.error i { color: var(--accent-red); }
    .toast.warning { border-left-color: var(--gold); } .toast.warning i { color: var(--gold); }
    @keyframes toastIn { from { opacity:0; transform: translateY(-20px) scale(0.95);} to {opacity:1; transform: translateY(0) scale(1);} }
    @keyframes toastOut { from { opacity:1; transform: translateY(0) scale(1);} to {opacity:0; transform: translateY(-10px) scale(0.95);} }

    .confirm-icon {
        width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        margin: 0 auto; font-size: 22px; background: rgba(63,200,255,0.15); color: var(--accent-blue);
    }
    .confirm-icon.danger { background: rgba(255,106,61,0.15); color: var(--accent-red); }
    .confirm-message { text-align: center; font-size: 15px; color: var(--text-main); line-height: 1.5; margin: 0; }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .detail-field { background: var(--bg-input); border-radius: 10px; padding: 10px 14px; }
    .detail-field .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-field .value { font-size: 14.5px; font-weight: 600; margin-top: 2px; }
    .detail-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .detail-photos img { width: 100%; border-radius: 10px; cursor: zoom-in; border: 1px solid var(--border-color); }
    .photo-tile { display: flex; flex-direction: column; gap: 4px; }
    .photo-hint { font-size: 10.5px; color: var(--text-muted); text-align: center; }

    .loading-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 30000;
        display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; color: white;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
        border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--accent-blue);
        width: 38px; height: 38px; border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
        .form-row { grid-template-columns: 1fr; }
        .detail-grid { grid-template-columns: 1fr; }
        header, .toolbar, .grid { padding-left: 16px; padding-right: 16px; }
    }
</style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="authOverlay" class="overlay">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="fa-solid fa-file-signature" style="font-size: 36px; color: var(--accent-blue); filter: drop-shadow(0 0 10px rgba(63,200,255,0.4));"></i>
        </div>
        <h1>CANHOTOS</h1>
        <p class="subtitle">Saldanha Rodrigues — comprovantes de entrega</p>
        <div id="authError" class="auth-error">Usuário ou senha inválidos.</div>
        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 14px; text-align: left;">
                <label>E-mail</label>
                <input type="email" id="loginEmail" placeholder="seu@email.com" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>
</div>

<!-- APP -->
<div id="app" style="display: none;">
    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-file-signature"></i></div>
            <div class="brand-text">
                <h1>CANHOTOS</h1>
                <p>Saldanha Rodrigues</p>
            </div>
        </div>
        <div class="user-box">
            <div class="user-pill">
                <div class="user-avatar" id="userAvatar">?</div>
                <span id="userName">Usuário</span>
            </div>
            <button class="icon-btn" onclick="logout()" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <div class="view-toggle">
        <button type="button" id="btnModoPastas" class="view-tab active" onclick="mudarModoVisualizacao('pastas')"><i class="fa-solid fa-folder"></i> Por Motorista</button>
        <button type="button" id="btnModoLista" class="view-tab" onclick="mudarModoVisualizacao('lista')"><i class="fa-solid fa-list"></i> Lista Completa</button>
    </div>

    <div id="pastaBreadcrumb" class="toolbar" style="display:none;">
        <a href="#" onclick="voltarUmNivel(); return false;" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> <span id="breadcrumbBackLabel">Motoristas</span></a>
        <h3 id="pastaMotoristaNome" style="margin:0; flex-grow:1; font-family:'Orbitron',sans-serif; font-size:1rem;"></h3>
        <select id="ordenacaoSelect" class="filter-select">
            <option value="data_desc">Data (mais recente primeiro)</option>
            <option value="data_asc">Data (mais antiga primeiro)</option>
            <option value="ref_asc">Referência (A-Z)</option>
            <option value="ref_desc">Referência (Z-A)</option>
        </select>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Buscar por cliente, motorista ou referência...">
        </div>
        <select id="tipoFilter" class="filter-select">
            <option value="todos">Todos os tipos</option>
        </select>
        <select id="motoristaFilter" class="filter-select" style="display:none;">
            <option value="todos">Todos os motoristas</option>
        </select>
        <select id="statusFilter" class="filter-select">
            <option value="todos">Todos os status</option>
            <option value="pendente">Pendentes</option>
            <option value="baixado">Baixados</option>
        </select>
        <button class="btn btn-primary" id="btnNovoDoc" onclick="abrirNovoCanhoto()" style="display:none;"><i class="fa-solid fa-plus"></i> Novo Documento</button>
    </div>

    <div id="grid" class="grid">
        <div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i>Carregando...</div>
    </div>
</div>

<!-- MODAL: NOVO/EDITAR DOCUMENTO -->
<div id="formOverlay" class="overlay hidden"></div>
<div id="formModal" class="modal hidden">
    <div class="modal-header">
        <h2 id="formModalTitle">Novo Documento</h2>
        <button class="modal-close" onclick="fecharFormCanhoto()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="form-group">
        <label>Tipo de Documento</label>
        <select id="campoTipo" class="filter-select" style="width: 100%; height: 48px;" onchange="atualizarCamposPorTipo()"></select>
    </div>

    <div class="form-group">
        <label id="labelArquivos">Arquivo(s)</label>
        <div class="photo-drop" onclick="document.getElementById('fotoInput').click()">
            <i class="fa-solid fa-camera"></i>
            Clique para adicionar foto(s) ou PDF
        </div>
        <input type="file" id="fotoInput" accept="image/*,.pdf,application/pdf" multiple style="display:none" onchange="handleFotoSelect(event)">
        <div class="photo-preview-grid" id="photoPreviewGrid"></div>
    </div>

    <div class="form-row">
        <div class="form-group" id="grupoCliente">
            <label>Cliente / Destinatário (quem assinou) — opcional</label>
            <input type="text" id="campoCliente" placeholder="Nome do cliente (deixe em branco se não souber)">
        </div>
        <div class="form-group">
            <label>Data — opcional</label>
            <input type="date" id="campoData">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Motorista</label>
            <input type="text" id="campoMotorista" placeholder="Nome do motorista" list="listaMotoristas">
            <datalist id="listaMotoristas"></datalist>
        </div>
        <div class="form-group">
            <label>Referência (nº do CT-e, boleto...)</label>
            <input type="text" id="campoReferencia" placeholder="Ex: NF 12345">
            <span id="avisoReferenciaDuplicada" style="display:none; align-items:center; gap:6px; color:var(--gold); font-size:0.8rem; margin-top:4px;"><i class="fa-solid fa-triangle-exclamation"></i> <span id="avisoReferenciaDuplicadaTexto"></span></span>
        </div>
    </div>

    <div class="form-group">
        <label>Observação (opcional)</label>
        <textarea id="campoObservacao" rows="2" placeholder="Alguma observação..."></textarea>
    </div>

    <button class="btn btn-primary" style="justify-content: center; padding: 13px;" onclick="salvarCanhoto()">
        <i class="fa-solid fa-floppy-disk"></i> Salvar Documento
    </button>
</div>

<!-- MODAL: DETALHE -->
<div id="detailOverlay" class="overlay hidden"></div>
<div id="detailModal" class="modal modal-wide hidden">
    <div class="modal-header">
        <h2>Detalhes do Canhoto</h2>
        <button class="modal-close" onclick="fecharDetalhe()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="detail-photos" id="detailPhotos"></div>
    <div class="detail-grid" id="detailFields"></div>
    <div style="display:flex; gap:10px; flex-wrap: wrap;">
        <button class="btn btn-primary" id="btnToggleStatus" style="flex:1; justify-content:center;" onclick="toggleStatusAtual()"></button>
        <button class="btn btn-ghost" id="btnEditarDoc" onclick="editarCanhotoAtual()"><i class="fa-solid fa-pen"></i> Editar</button>
        <button class="btn btn-danger-outline" id="btnExcluirDoc" onclick="excluirCanhotoAtual()"><i class="fa-solid fa-trash"></i></button>
    </div>
</div>

<!-- CONFIRM MODAL -->
<div id="confirmOverlay" class="overlay hidden"></div>
<div id="confirmModal" class="modal hidden" style="max-width: 380px; text-align: center;">
    <div class="confirm-icon" id="confirmIcon"><i class="fa-solid fa-circle-question"></i></div>
    <p class="confirm-message" id="confirmMessage"></p>
    <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirmBtnCancel" style="justify-content:center;">Cancelar</button>
        <button class="btn btn-primary" id="confirmBtnYes" style="justify-content:center;">Confirmar</button>
    </div>
</div>

<div id="toastContainer"></div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <span id="loadingText">Processando...</span>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

    // CONFIGURAÇÃO FIREBASE — preencher depois de criar o projeto no console
    const firebaseConfig = {
        apiKey: "AIzaSyCpOGQW-LgKK655UIVLYgDmrAmsPjiGsF8",
        authDomain: "canhotos-saldanha.firebaseapp.com",
        projectId: "canhotos-saldanha",
        storageBucket: "canhotos-saldanha.firebasestorage.app",
        messagingSenderId: "28452747769",
        appId: "1:28452747769:web:fbe42698e15ae382eba528"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // CONFIGURAÇÃO CLOUDINARY — reaproveitando a mesma conta dos outros sites
    const CLOUDINARY_CLOUD = "o1nv9kjt";
    const CLOUDINARY_PRESET = "lothwar_store";

    // PDF vai pelo endpoint "raw", não "image": por padrão o Cloudinary
    // BLOQUEIA a abertura de PDF enviado como imagem (a URL existe, mas o
    // acesso dá erro) — é uma trava de segurança da própria plataforma. Como
    // "raw" entrega o arquivo como está, sem tentar processar como imagem,
    // não cai nessa trava. Detecta PDF pelo MIME type OU pela extensão do
    // nome do arquivo (o navegador às vezes não preenche file.type direito).
    const uploadToCloudinary = async (file) => {
        const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        const resourceType = isPdf ? 'raw' : 'image';
        console.log(`[upload] arquivo="${file.name}" file.type="${file.type}" isPdf=${isPdf} resourceType="${resourceType}"`);
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', CLOUDINARY_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/${resourceType}/upload`, { method: 'POST', body: fd });
        const data = await res.json();
        console.log('[upload] resposta do Cloudinary:', data);
        if (data.error) throw new Error('Cloudinary: ' + data.error.message);
        return { url: data.secure_url, isPdf, nome: file.name };
    };

    // Pede pro Cloudinary já entregar a foto comprimida e no tamanho certo pro
    // lugar onde vai aparecer (miniatura pequena na lista, maior no detalhe),
    // em vez da foto original pesada toda vez — é o que evita o site ficar
    // lento conforme o acervo de documentos cresce. Não se aplica a PDF.
    const getOptimizedImageUrl = (url, width = 400) => {
        if (!url || typeof url !== 'string') return url;
        if (url.includes('cloudinary.com') && url.includes('/upload/')) {
            return url.replace('/upload/', `/upload/f_auto,q_auto,w_${width}/`);
        }
        return url;
    };

    // --- TIPOS DE DOCUMENTO ---
    const TIPOS_DOCUMENTO = {
        cte: { label: 'CT-e', temCliente: false, temStatus: false },
        relatorio_cobranca: { label: 'Relatório de Cobrança', temCliente: false, temStatus: false },
        boleto: { label: 'Boleto', temCliente: false, temStatus: false },
        canhoto: { label: 'Canhoto Assinado', temCliente: true, temStatus: true }
    };
    // Fallback só pra não quebrar a tela se algum documento antigo (de um tipo
    // já removido, tipo CIOT/Contrato/MDF-e) ainda estiver salvo no banco.
    const TIPO_DESCONHECIDO = { label: 'Outro', temCliente: false, temStatus: false };

    const tipoSelect = document.getElementById('campoTipo');
    tipoSelect.innerHTML = Object.entries(TIPOS_DOCUMENTO).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');

    window.atualizarCamposPorTipo = () => {
        const tipo = document.getElementById('campoTipo').value;
        const info = TIPOS_DOCUMENTO[tipo] || {};
        document.getElementById('grupoCliente').style.display = info.temCliente ? 'flex' : 'none';
    };

    // --- TOAST / CONFIRM ---
    const toastContainer = document.getElementById('toastContainer');
    const TOAST_ICONS = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info', warning: 'fa-triangle-exclamation' };
    window.showToast = (message, type = 'info', duration = 3500) => {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fa-solid ${TOAST_ICONS[type] || TOAST_ICONS.info}"></i><span>${message}</span>`;
        toastContainer.appendChild(toast);
        setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 250); }, duration);
    };

    const confirmOverlay = document.getElementById('confirmOverlay');
    const confirmModal = document.getElementById('confirmModal');
    const confirmMessageEl = document.getElementById('confirmMessage');
    const confirmIconEl = document.getElementById('confirmIcon');
    const confirmBtnYes = document.getElementById('confirmBtnYes');
    const confirmBtnCancel = document.getElementById('confirmBtnCancel');
    window.showConfirm = (message, { danger = false, confirmText = 'Confirmar' } = {}) => {
        return new Promise((resolve) => {
            confirmMessageEl.innerText = message;
            confirmBtnYes.innerText = confirmText;
            confirmIconEl.className = 'confirm-icon' + (danger ? ' danger' : '');
            confirmIconEl.innerHTML = danger ? '<i class="fa-solid fa-triangle-exclamation"></i>' : '<i class="fa-solid fa-circle-question"></i>';
            confirmBtnYes.className = 'btn btn-primary' + (danger ? ' btn-danger-outline' : '');
            confirmBtnYes.style.justifyContent = 'center';
            confirmOverlay.classList.remove('hidden');
            confirmModal.classList.remove('hidden');
            const cleanup = (result) => {
                confirmOverlay.classList.add('hidden');
                confirmModal.classList.add('hidden');
                confirmBtnYes.removeEventListener('click', onYes);
                confirmBtnCancel.removeEventListener('click', onCancel);
                confirmOverlay.removeEventListener('click', onCancel);
                resolve(result);
            };
            const onYes = () => cleanup(true);
            const onCancel = () => cleanup(false);
            confirmBtnYes.addEventListener('click', onYes);
            confirmBtnCancel.addEventListener('click', onCancel);
            confirmOverlay.addEventListener('click', onCancel);
        });
    };

    function showLoading(text) {
        document.getElementById('loadingText').innerText = text;
        document.getElementById('loadingOverlay').classList.add('active');
    }
    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    // --- AUTH ---
    const authOverlay = document.getElementById('authOverlay');
    const appEl = document.getElementById('app');
    const authError = document.getElementById('authError');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        authError.style.display = 'none';
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPass').value;
        showLoading('Entrando...');
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
            console.error(err);
            authError.innerText = 'E-mail ou senha inválidos.';
            authError.style.display = 'block';
        } finally {
            hideLoading();
        }
    });

    window.logout = async () => {
        if (!(await showConfirm('Deseja realmente sair?'))) return;
        await signOut(auth);
    };

    let unsubscribeCanhotos = null;
    let userRole = 'viewer'; // padrão seguro: só vira 'master' se o perfil confirmar
    window.isMaster = () => userRole === 'master';

    function aplicarPermissoesNaUI() {
        const master = isMaster();
        document.getElementById('btnNovoDoc').style.display = master ? 'flex' : 'none';
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            authOverlay.classList.add('hidden');
            appEl.style.display = 'block';
            const name = user.email.split('@')[0];
            document.getElementById('userName').innerText = name;
            document.getElementById('userAvatar').innerText = name.charAt(0).toUpperCase();

            try {
                const perfilSnap = await getDoc(doc(db, 'perfis', user.uid));
                userRole = (perfilSnap.exists() && perfilSnap.data().role === 'master') ? 'master' : 'viewer';
            } catch (e) {
                console.error('Erro ao checar perfil:', e);
                userRole = 'viewer';
            }
            aplicarPermissoesNaUI();
            iniciarListenerCanhotos();
        } else {
            authOverlay.classList.remove('hidden');
            appEl.style.display = 'none';
            if (unsubscribeCanhotos) { unsubscribeCanhotos(); unsubscribeCanhotos = null; }
        }
    });

    // --- DADOS ---
    let canhotosGlobais = [];
    let fotosTemp = []; // { file, previewUrl } ou { url } se já salva (edição)
    let editingId = null;
    let detalheAtualId = null;
    let viewMode = 'pastas'; // 'pastas' | 'lista'
    let motoristaAtivo = null; // nome do motorista quando dentro de uma pasta
    let dataAtiva = null; // data quando dentro da subpasta de data de um motorista

    function iniciarListenerCanhotos() {
        const q = query(collection(db, "documentos"), orderBy("criadoEm", "desc"));
        unsubscribeCanhotos = onSnapshot(q, (snap) => {
            canhotosGlobais = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            atualizarFiltroTipo();
            atualizarFiltroMotorista();
            renderizarTudo();
        }, (err) => {
            console.error(err);
            showToast('Erro ao carregar documentos: ' + err.message, 'error');
        });
    }

    function renderizarTudo() {
        if (viewMode === 'pastas' && !motoristaAtivo) {
            renderizarPastas();
        } else if (viewMode === 'pastas' && motoristaAtivo && !dataAtiva) {
            renderizarPastasData();
        } else {
            renderizarGrid();
        }
    }

    window.mudarModoVisualizacao = (modo) => {
        viewMode = modo;
        motoristaAtivo = null;
        dataAtiva = null;
        document.getElementById('btnModoPastas').classList.toggle('active', modo === 'pastas');
        document.getElementById('btnModoLista').classList.toggle('active', modo === 'lista');
        document.getElementById('motoristaFilter').style.display = modo === 'lista' ? '' : 'none';
        document.getElementById('pastaBreadcrumb').style.display = 'none';
        renderizarTudo();
    };

    function atualizarBreadcrumb() {
        const nomeExibicao = motoristaAtivo === '__sem_motorista__' ? 'Sem motorista definido' : motoristaAtivo;
        const backLabel = document.getElementById('breadcrumbBackLabel');
        const heading = document.getElementById('pastaMotoristaNome');
        const ord = document.getElementById('ordenacaoSelect');
        if (dataAtiva) {
            backLabel.innerText = nomeExibicao;
            heading.innerText = dataAtiva === '__sem_data__' ? 'Sem data definida' : formatarData(dataAtiva);
            ord.style.display = '';
        } else {
            backLabel.innerText = 'Motoristas';
            heading.innerText = nomeExibicao;
            ord.style.display = 'none';
        }
    }

    window.abrirPastaMotorista = (nome) => {
        motoristaAtivo = nome;
        dataAtiva = null;
        document.getElementById('pastaBreadcrumb').style.display = 'flex';
        atualizarBreadcrumb();
        renderizarTudo();
    };

    window.abrirPastaData = (data) => {
        dataAtiva = data;
        atualizarBreadcrumb();
        renderizarTudo();
    };

    window.voltarUmNivel = () => {
        if (dataAtiva) {
            dataAtiva = null;
            atualizarBreadcrumb();
            renderizarTudo();
        } else {
            voltarParaPastas();
        }
    };

    window.voltarParaPastas = () => {
        motoristaAtivo = null;
        dataAtiva = null;
        document.getElementById('pastaBreadcrumb').style.display = 'none';
        renderizarPastas();
    };

    document.getElementById('ordenacaoSelect').addEventListener('change', renderizarGrid);

    function renderizarPastas() {
        const grid = document.getElementById('grid');
        const filtrados = aplicarFiltrosComuns(canhotosGlobais);
        const contagem = {};
        filtrados.forEach(c => {
            const chave = c.motorista || '__sem_motorista__';
            contagem[chave] = (contagem[chave] || 0) + 1;
        });

        const nomes = Object.keys(contagem).sort((a, b) => {
            if (a === '__sem_motorista__') return 1;
            if (b === '__sem_motorista__') return -1;
            return a.localeCompare(b);
        });

        if (nomes.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i>Nenhum documento cadastrado ainda.</div>`;
            return;
        }

        window._nomesPastas = nomes; // lookup por índice, evita escapar nome no onclick
        grid.innerHTML = nomes.map((nome, idx) => {
            const label = nome === '__sem_motorista__' ? 'Sem motorista definido' : nome;
            const qtd = contagem[nome];
            return `
                <div class="folder-card" onclick="abrirPastaMotoristaPorIndice(${idx})">
                    <i class="fa-solid fa-folder"></i>
                    <div>
                        <div class="folder-name">${escapeHtml(label)}</div>
                        <div class="folder-count">${qtd} documento${qtd === 1 ? '' : 's'}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.abrirPastaMotoristaPorIndice = (idx) => {
        abrirPastaMotorista(window._nomesPastas[idx]);
    };

    function renderizarPastasData() {
        const grid = document.getElementById('grid');
        const filtrados = aplicarFiltrosComuns(canhotosGlobais)
            .filter(c => (c.motorista || '__sem_motorista__') === motoristaAtivo);
        const contagem = {};
        filtrados.forEach(c => {
            const chave = c.data || '__sem_data__';
            contagem[chave] = (contagem[chave] || 0) + 1;
        });

        const datas = Object.keys(contagem).sort((a, b) => {
            if (a === '__sem_data__') return 1;
            if (b === '__sem_data__') return -1;
            return b.localeCompare(a); // mais recente primeiro
        });

        if (datas.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i>Nenhum documento encontrado.</div>`;
            return;
        }

        window._datasPastas = datas; // lookup por índice, evita escapar valor no onclick
        grid.innerHTML = datas.map((data, idx) => {
            const label = data === '__sem_data__' ? 'Sem data definida' : formatarData(data);
            const qtd = contagem[data];
            return `
                <div class="folder-card" onclick="abrirPastaDataPorIndice(${idx})">
                    <i class="fa-solid fa-calendar-days"></i>
                    <div>
                        <div class="folder-name">${escapeHtml(label)}</div>
                        <div class="folder-count">${qtd} documento${qtd === 1 ? '' : 's'}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.abrirPastaDataPorIndice = (idx) => {
        abrirPastaData(window._datasPastas[idx]);
    };

    function atualizarFiltroTipo() {
        const sel = document.getElementById('tipoFilter');
        const atual = sel.value;
        sel.innerHTML = '<option value="todos">Todos os tipos</option>' +
            Object.entries(TIPOS_DOCUMENTO).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
        sel.value = atual || 'todos';
    }

    function atualizarFiltroMotorista() {
        const sel = document.getElementById('motoristaFilter');
        const atual = sel.value;
        const nomes = [...new Set(canhotosGlobais.map(c => c.motorista).filter(Boolean))].sort();
        sel.innerHTML = '<option value="todos">Todos os motoristas</option>' +
            nomes.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
        sel.value = atual || 'todos';

        const datalist = document.getElementById('listaMotoristas');
        if (datalist) datalist.innerHTML = nomes.map(n => `<option value="${escapeHtml(n)}">`).join('');
    }

    // Filtros de busca/tipo/status valem em qualquer modo (pastas, dentro de
    // uma pasta, ou lista). O filtro de motorista só se aplica à parte (via
    // dropdown na Lista, ou via motoristaAtivo dentro de uma pasta).
    // Remove pontuação comum de nº de documento (., -, /) pra buscar "96369" e achar "96.369"
    const normalizarBusca = (s) => s.toLowerCase().replace(/[.\-\/]/g, '');

    // Extrai cada nº de documento citado numa referência, com ou sem "NF"/pontos,
    // mesmo quando há mais de um (ex: "NF 96.666 - 97.777" -> ['96666', '97777'])
    function extrairNumerosReferencia(texto) {
        if (!texto) return [];
        const matches = texto.match(/[\d.]+/g) || [];
        return matches.map(m => m.replace(/\./g, '')).filter(Boolean);
    }

    let avisoReferenciaJaMostrado = false;

    window.verificarReferenciaDuplicada = () => {
        const input = document.getElementById('campoReferencia');
        const aviso = document.getElementById('avisoReferenciaDuplicada');
        const numeros = extrairNumerosReferencia(input.value);
        let mensagem = null;

        if (numeros.length > 0) {
            for (const c of canhotosGlobais) {
                if (editingId && c.id === editingId) continue;
                const numerosExistentes = extrairNumerosReferencia(c.referencia);
                const repetido = numeros.find(n => numerosExistentes.includes(n));
                if (repetido) {
                    const quem = c.motorista ? ` (${c.motorista}${c.data ? ', ' + formatarData(c.data) : ''})` : '';
                    mensagem = `Nº ${repetido} já usado em outro documento${quem}.`;
                    break;
                }
            }
        }

        if (mensagem) {
            document.getElementById('avisoReferenciaDuplicadaTexto').innerText = mensagem;
            aviso.style.display = 'flex';
            if (!avisoReferenciaJaMostrado) showToast(mensagem, 'warning');
            avisoReferenciaJaMostrado = true;
            return;
        }
        avisoReferenciaJaMostrado = false;
        aviso.style.display = 'none';
    };

    document.getElementById('campoReferencia').addEventListener('input', verificarReferenciaDuplicada);

    function aplicarFiltrosComuns(lista) {
        const buscaRaw = document.getElementById('searchInput').value.trim();
        const busca = normalizarBusca(buscaRaw);
        // Se a busca tem dígitos, trata como nº de documento: compara prefixo contra
        // cada nº extraído da referência (evita "97" achar "96.397" só por ter "97" no fim)
        const buscaNumeros = extrairNumerosReferencia(buscaRaw);
        const statusF = document.getElementById('statusFilter').value;
        const tipoF = document.getElementById('tipoFilter').value;

        return lista.filter(c => {
            if (statusF !== 'todos' && c.status !== statusF) return false;
            if (tipoF !== 'todos' && c.tipo !== tipoF) return false;
            if (busca) {
                const alvoTexto = normalizarBusca(`${c.clienteFinal || ''} ${c.motorista || ''}`);
                let bate = alvoTexto.includes(busca);
                if (!bate) {
                    const numerosDoc = extrairNumerosReferencia(c.referencia);
                    bate = buscaNumeros.length > 0
                        ? buscaNumeros.some(bn => numerosDoc.some(nd => nd.startsWith(bn)))
                        : normalizarBusca(c.referencia || '').includes(busca);
                }
                if (!bate) return false;
            }
            return true;
        });
    }

    function renderizarGrid() {
        let filtrados = aplicarFiltrosComuns(canhotosGlobais);

        if (motoristaAtivo) {
            filtrados = filtrados.filter(c => (c.motorista || '__sem_motorista__') === motoristaAtivo);
            if (dataAtiva) {
                filtrados = filtrados.filter(c => (c.data || '__sem_data__') === dataAtiva);
            }
            const ord = document.getElementById('ordenacaoSelect').value;
            filtrados.sort((a, b) => {
                if (ord === 'data_asc') return (a.data || '').localeCompare(b.data || '');
                if (ord === 'data_desc') return (b.data || '').localeCompare(a.data || '');
                if (ord === 'ref_asc') return (a.referencia || '').localeCompare(b.referencia || '');
                if (ord === 'ref_desc') return (b.referencia || '').localeCompare(a.referencia || '');
                return 0;
            });
        } else {
            const motoristaF = document.getElementById('motoristaFilter').value;
            if (motoristaF !== 'todos') filtrados = filtrados.filter(c => c.motorista === motoristaF);
        }

        const grid = document.getElementById('grid');
        if (filtrados.length === 0) {
            grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i>Nenhum documento encontrado.</div>`;
            return;
        }

        grid.innerHTML = filtrados.map(c => {
            const primeiroArquivo = (c.arquivos && c.arquivos[0]) || null;
            const dataFmt = c.data ? formatarData(c.data) : '-';
            const tipoInfo = TIPOS_DOCUMENTO[c.tipo] || TIPO_DESCONHECIDO;
            const tituloCard = c.tipo === 'canhoto' ? (c.clienteFinal || 'Sem nome') : tipoInfo.label;

            let thumbHtml = `<div class="no-photo"><i class="fa-regular fa-image"></i></div>`;
            if (primeiroArquivo) {
                thumbHtml = primeiroArquivo.isPdf
                    ? `<div class="pdf-tile"><i class="fa-solid fa-file-pdf"></i><span>${escapeHtml(primeiroArquivo.nome || 'PDF')}</span></div>`
                    : `<img src="${getOptimizedImageUrl(primeiroArquivo.url, 400)}" loading="lazy" alt="">`;
            }

            return `
                <div class="card" onclick="abrirDetalhe('${c.id}')">
                    <div class="card-thumb">
                        ${thumbHtml}
                        <span class="type-badge">${tipoInfo.label}</span>
                        ${tipoInfo.temStatus ? `<span class="status-badge ${c.status}">${c.status === 'baixado' ? 'Baixado' : 'Pendente'}</span>` : ''}
                    </div>
                    <div class="card-body">
                        <div class="card-cliente">${escapeHtml(tituloCard)}</div>
                        ${c.motorista ? `<div class="card-motorista"><i class="fa-solid fa-truck"></i> ${escapeHtml(c.motorista)}</div>` : ''}
                        <div class="card-meta"><i class="fa-regular fa-calendar"></i> ${dataFmt}</div>
                        ${c.referencia ? `<div class="card-meta"><i class="fa-solid fa-hashtag"></i> ${escapeHtml(c.referencia)}</div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function formatarData(iso) {
        const [y, m, d] = iso.split('-');
        return `${d}/${m}/${y}`;
    }
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', renderizarTudo);
    document.getElementById('statusFilter').addEventListener('change', renderizarTudo);
    document.getElementById('tipoFilter').addEventListener('change', renderizarTudo);
    document.getElementById('motoristaFilter').addEventListener('change', renderizarGrid);

    // --- FORM NOVO/EDITAR ---
    window.abrirNovoCanhoto = () => {
        if (!isMaster()) return;
        editingId = null;
        fotosTemp = [];
        document.getElementById('formModalTitle').innerText = 'Novo Documento';
        document.getElementById('campoTipo').value = 'canhoto';
        atualizarCamposPorTipo();
        document.getElementById('campoCliente').value = '';
        document.getElementById('campoData').value = new Date().toISOString().split('T')[0];
        document.getElementById('campoMotorista').value = '';
        document.getElementById('campoReferencia').value = '';
        document.getElementById('campoObservacao').value = '';
        document.getElementById('avisoReferenciaDuplicada').style.display = 'none';
        avisoReferenciaJaMostrado = false;
        renderizarPreviewFotos();
        document.getElementById('formOverlay').classList.remove('hidden');
        document.getElementById('formModal').classList.remove('hidden');
    };

    window.fecharFormCanhoto = () => {
        document.getElementById('formOverlay').classList.add('hidden');
        document.getElementById('formModal').classList.add('hidden');
    };

    window.handleFotoSelect = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            const isPdf = file.type === 'application/pdf';
            fotosTemp.push({ file, isPdf, nome: file.name, previewUrl: isPdf ? null : URL.createObjectURL(file) });
        });
        renderizarPreviewFotos();
        e.target.value = '';
    };

    window.removerFotoTemp = (idx) => {
        fotosTemp.splice(idx, 1);
        renderizarPreviewFotos();
    };

    function renderizarPreviewFotos() {
        const grid = document.getElementById('photoPreviewGrid');
        grid.innerHTML = fotosTemp.map((f, i) => {
            const conteudo = f.isPdf
                ? `<div class="pdf-tile"><i class="fa-solid fa-file-pdf"></i><span>${escapeHtml(f.nome || 'PDF')}</span></div>`
                : '';
            const estiloFundo = f.isPdf ? '' : `style="background-image: url('${f.previewUrl || getOptimizedImageUrl(f.url, 200)}')"`;
            return `
                <div class="photo-preview" ${estiloFundo}>
                    ${conteudo}
                    <button type="button" class="remove-photo" onclick="removerFotoTemp(${i})"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `;
        }).join('');
    }

    window.salvarCanhoto = async () => {
        if (!isMaster()) return;
        const tipo = document.getElementById('campoTipo').value;
        const tipoInfo = TIPOS_DOCUMENTO[tipo] || TIPO_DESCONHECIDO;
        const cliente = document.getElementById('campoCliente').value.trim();
        const data = document.getElementById('campoData').value;
        const motorista = document.getElementById('campoMotorista').value.trim();
        const referencia = document.getElementById('campoReferencia').value.trim();
        const observacao = document.getElementById('campoObservacao').value.trim();

        if (fotosTemp.length === 0) {
            return showToast('Adicione pelo menos um arquivo.', 'error');
        }

        showLoading('Salvando documento...');
        try {
            const arquivos = [];
            for (let i = 0; i < fotosTemp.length; i++) {
                const f = fotosTemp[i];
                if (f.url) { arquivos.push({ url: f.url, isPdf: !!f.isPdf, nome: f.nome || '' }); continue; }
                document.getElementById('loadingText').innerText = `Enviando arquivo ${i + 1}/${fotosTemp.length}...`;
                const resultado = await uploadToCloudinary(f.file);
                arquivos.push({ url: resultado.url, isPdf: resultado.isPdf, nome: resultado.nome });
            }

            const payload = {
                tipo,
                clienteFinal: tipoInfo.temCliente ? cliente : '',
                data,
                motorista,
                referencia,
                observacao,
                arquivos,
                userId: auth.currentUser.uid,
                atualizadoEm: new Date().toISOString()
            };

            if (editingId) {
                await updateDoc(doc(db, "documentos", editingId), payload);
                showToast('Documento atualizado!', 'success');
            } else {
                if (tipoInfo.temStatus) payload.status = 'pendente';
                payload.criadoEm = new Date().toISOString();
                payload.criadoPor = auth.currentUser.email;
                await addDoc(collection(db, "documentos"), payload);
                showToast('Documento salvo!', 'success');
            }
            fecharFormCanhoto();
        } catch (e) {
            console.error(e);
            showToast('Erro ao salvar: ' + e.message, 'error');
        } finally {
            hideLoading();
        }
    };

    // --- DETALHE ---
    window.abrirDetalhe = (id) => {
        const c = canhotosGlobais.find(x => x.id === id);
        if (!c) return;
        detalheAtualId = id;
        const tipoInfo = TIPOS_DOCUMENTO[c.tipo] || TIPO_DESCONHECIDO;

        document.getElementById('detailPhotos').innerHTML = (c.arquivos || []).map(arq =>
            arq.isPdf
                ? `<a href="${arq.url}" target="_blank" class="pdf-tile" style="border-radius:10px; border:1px solid var(--border-color); aspect-ratio:1; text-decoration:none;"><i class="fa-solid fa-file-pdf"></i><span>${escapeHtml(arq.nome || 'Abrir PDF')}</span></a>`
                : `<div class="photo-tile"><img src="${getOptimizedImageUrl(arq.url, 900)}" loading="lazy" onclick="window.open('${arq.url}', '_blank')"><span class="photo-hint">Clique na imagem para ver</span></div>`
        ).join('');

        document.getElementById('detailFields').innerHTML = `
            <div class="detail-field"><div class="label">Tipo</div><div class="value">${tipoInfo.label}</div></div>
            <div class="detail-field"><div class="label">Data</div><div class="value">${c.data ? formatarData(c.data) : '-'}</div></div>
            ${tipoInfo.temCliente ? `<div class="detail-field"><div class="label">Cliente</div><div class="value">${escapeHtml(c.clienteFinal || '-')}</div></div>` : ''}
            ${c.motorista ? `<div class="detail-field"><div class="label">Motorista</div><div class="value">${escapeHtml(c.motorista)}</div></div>` : ''}
            <div class="detail-field"><div class="label">Referência</div><div class="value">${escapeHtml(c.referencia || '-')}</div></div>
            ${tipoInfo.temStatus ? `<div class="detail-field"><div class="label">Status</div><div class="value">${c.status === 'baixado' ? 'Baixado' : 'Pendente'}</div></div>` : ''}
            ${c.observacao ? `<div class="detail-field" style="grid-column: 1 / -1;"><div class="label">Observação</div><div class="value">${escapeHtml(c.observacao)}</div></div>` : ''}
        `;

        const btn = document.getElementById('btnToggleStatus');
        const master = isMaster();
        btn.style.display = tipoInfo.temStatus ? 'flex' : 'none';
        if (c.status === 'baixado') {
            btn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> Marcar como Pendente';
        } else {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Marcar como Baixado';
        }
        document.getElementById('btnEditarDoc').style.display = master ? 'flex' : 'none';
        document.getElementById('btnExcluirDoc').style.display = master ? 'flex' : 'none';

        document.getElementById('detailOverlay').classList.remove('hidden');
        document.getElementById('detailModal').classList.remove('hidden');
    };

    window.fecharDetalhe = () => {
        document.getElementById('detailOverlay').classList.add('hidden');
        document.getElementById('detailModal').classList.add('hidden');
        detalheAtualId = null;
    };

    window.toggleStatusAtual = async () => {
        const c = canhotosGlobais.find(x => x.id === detalheAtualId);
        if (!c) return;
        const novoStatus = c.status === 'baixado' ? 'pendente' : 'baixado';
        try {
            const payload = { status: novoStatus };
            if (novoStatus === 'baixado') {
                payload.baixadoPor = auth.currentUser.email;
                payload.baixadoEm = new Date().toISOString();
            }
            await updateDoc(doc(db, "documentos", detalheAtualId), payload);
            showToast(novoStatus === 'baixado' ? 'Marcado como baixado!' : 'Marcado como pendente.', 'success');
            fecharDetalhe();
        } catch (e) {
            console.error(e);
            showToast('Erro ao atualizar status: ' + e.message, 'error');
        }
    };

    window.editarCanhotoAtual = () => {
        if (!isMaster()) return;
        const c = canhotosGlobais.find(x => x.id === detalheAtualId);
        if (!c) return;
        editingId = c.id;
        fotosTemp = (c.arquivos || []).map(arq => ({ url: arq.url, isPdf: arq.isPdf, nome: arq.nome }));
        document.getElementById('formModalTitle').innerText = 'Editar Documento';
        document.getElementById('campoTipo').value = c.tipo || 'outro';
        atualizarCamposPorTipo();
        document.getElementById('campoCliente').value = c.clienteFinal || '';
        document.getElementById('campoData').value = c.data || '';
        document.getElementById('campoMotorista').value = c.motorista || '';
        document.getElementById('campoReferencia').value = c.referencia || '';
        document.getElementById('campoObservacao').value = c.observacao || '';
        document.getElementById('avisoReferenciaDuplicada').style.display = 'none';
        avisoReferenciaJaMostrado = false;
        renderizarPreviewFotos();
        fecharDetalhe();
        document.getElementById('formOverlay').classList.remove('hidden');
        document.getElementById('formModal').classList.remove('hidden');
    };

    window.excluirCanhotoAtual = async () => {
        if (!isMaster()) return;
        if (!(await showConfirm('Excluir este documento permanentemente? Os arquivos continuam no Cloudinary, só o registro sai daqui.', { danger: true, confirmText: 'Excluir' }))) return;
        showLoading('Excluindo...');
        try {
            await deleteDoc(doc(db, "documentos", detalheAtualId));
            showToast('Documento excluído.', 'success');
            fecharDetalhe();
        } catch (e) {
            console.error(e);
            showToast('Erro ao excluir: ' + e.message, 'error');
        } finally {
            hideLoading();
        }
    };
</script>
</body>
</html>
